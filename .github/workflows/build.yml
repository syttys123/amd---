name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify PowerShell syntax
        shell: pwsh
        run: |
          $files = @(
            "native/build.ps1",
            "native/build-package.ps1",
            "native/verify-native.ps1",
            "native/verify-rust-gui.ps1",
            "native/verify-release.ps1",
            "native/verify-upgrade.ps1",
            "native/capture-rust-gui-redesign.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$file syntax errors: $($errors.Message -join '; ')"
            }
          }
      - name: Verify Rust formatting and lint
        shell: pwsh
        run: |
          cargo fmt --manifest-path native\rust-gui\Cargo.toml -- --check
          cargo clippy `
            --manifest-path native\rust-gui\Cargo.toml `
            --all-targets `
            --locked `
            -- -D warnings
      - name: Verify native migration slice
        shell: pwsh
        run: |
          .\native\verify-native.ps1
      - name: Build RyzenAdj runtime
        shell: pwsh
        run: |
          .\build-ryzenadj.ps1
      - name: Build native preview package
        shell: pwsh
        run: |
          .\native\build.ps1
          $version = "0.6.0-native-ci." + $env:GITHUB_RUN_NUMBER
          .\native\build-package.ps1 `
            -NoBuild `
            -SkipRuntimeVerification `
            -Version $version
      - name: Audit package dependencies
        shell: pwsh
        run: |
          .\verify-dependencies.ps1 -Solution AmdMobilePower.sln
      - name: Verify release gates and build package
        shell: pwsh
        run: |
          $version = "1.0.5-ci." + $env:GITHUB_SHA.Substring(0, 7)
          .\verify-release.ps1 `
            -Version $version `
            -VerifyShellIntegration `
            -VerifyDiagnostics
      - name: Upload portable package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: amd-mobile-power-win-x64
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*.zip.sha256
          if-no-files-found: error
      - name: Upload native preview package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: amd-mobile-power-native-preview
          path: |
            artifacts/native-packages/*.zip
            artifacts/native-packages/*.zip.sha256
          if-no-files-found: error

