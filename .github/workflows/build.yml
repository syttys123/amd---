name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore AmdMobilePower.sln
      - name: Build
        run: dotnet build AmdMobilePower.sln -c Release --no-restore
      - name: Test
        run: dotnet test AmdMobilePower.sln -c Release --no-build

