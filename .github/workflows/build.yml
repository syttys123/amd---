name: build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.427
      - name: Audit package vulnerabilities
        shell: pwsh
        run: |
          .\verify-dependencies.ps1 -Solution AmdMobilePower.sln
      - name: Verify release gates and build package
        shell: pwsh
        run: |
          $version = "0.1.0-" + $env:GITHUB_SHA.Substring(0, 7)
          .\verify-release.ps1 `
            -Version $version `
            -VerifyShellIntegration `
            -VerifyDiagnostics
      - name: Upload portable package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: amd-mobile-power-win-x64
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*.zip.sha256
          if-no-files-found: error

