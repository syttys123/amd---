name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI_VERSION: 1.1.0-ci
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify PowerShell syntax
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path native -Filter *.ps1 -File)
          $files += @(Get-ChildItem -Path . -Filter *.ps1 -File)
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              throw "$($file.Name) syntax errors: $($errors.Message -join '; ')"
            }
          }

      - name: Verify Rust formatting and lint
        shell: pwsh
        run: |
          cargo fmt --manifest-path native\rust-gui\Cargo.toml -- --check
          cargo clippy `
            --manifest-path native\rust-gui\Cargo.toml `
            --all-targets `
            --locked `
            -- -D warnings
          cargo fmt --manifest-path native\rust-probe\Cargo.toml -- --check
          cargo clippy `
            --manifest-path native\rust-probe\Cargo.toml `
            --all-targets `
            --locked `
            -- -D warnings

      - name: Verify native migration slice
        shell: pwsh
        run: |
          .\native\verify-native.ps1

      - name: Build RyzenAdj runtime
        shell: pwsh
        run: |
          .\build-ryzenadj.ps1

      - name: Build native runtime and run all tests
        shell: pwsh
        run: |
          .\native\build.ps1

      - name: Verify reproducible binaries and portable package
        shell: pwsh
        run: |
          $version = "$env:CI_VERSION." + $env:GITHUB_SHA.Substring(0, 7)
          .\native\verify-reproducibility.ps1 `
            -PackageVersion $version `
            -EvidencePath artifacts\ci\reproducibility.json

      - name: Headless probe self-test
        shell: pwsh
        run: |
          $version = "$env:CI_VERSION." + $env:GITHUB_SHA.Substring(0, 7)
          $probe = Join-Path `
            "artifacts\native-packages" `
            "amd-mobile-power-v$version-win-x64-native-preview\amd-mobile-power-probe.exe"
          $selfTest = & $probe --self-test | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or
              $selfTest.selfTest -ne "PASS" -or
              [int]$selfTest.schemaVersion -ne 1 -or
              $selfTest.readOnlyByDefault -ne $true) {
            throw "Headless probe self-test failed."
          }

      - name: Audit package dependencies
        shell: pwsh
        run: |
          .\verify-dependencies.ps1 -Solution AmdMobilePower.sln

      - name: Verify legacy release gates
        shell: pwsh
        run: |
          $version = "1.0.5-ci." + $env:GITHUB_SHA.Substring(0, 7)
          .\verify-release.ps1 `
            -Version $version `
            -VerifyShellIntegration `
            -VerifyDiagnostics

      - name: Upload portable package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: amd-mobile-power-win-x64
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*.zip.sha256
          if-no-files-found: error

      - name: Upload native portable package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: amd-mobile-power-native-win-x64
          path: |
            artifacts/native-packages/*.zip
            artifacts/native-packages/*.zip.sha256
            artifacts/native-packages/*/BUILD-INFO.txt
          if-no-files-found: error

      - name: Upload native preview package
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: amd-mobile-power-native-preview
          path: |
            artifacts/native-packages/*.zip
            artifacts/native-packages/*.zip.sha256
            artifacts/ci/reproducibility.json
          if-no-files-found: error
